<style>
/* Layout: a deck you can also scroll; each slide is one claim, its before→after evidence, and where it was measured. */
:root {
  --bg: #edf1f5;
  --surface: #ffffff;
  --ink: #0f1822;
  --muted: #566476;
  --line: #d8e0e8;
  --accent: #1683c7;
  --accent-soft: rgba(22, 131, 199, .11);
  --before: #b9c3ce;
  --win: #11804a;
  --win-soft: rgba(17, 128, 74, .11);
  --warn: #9a5b00;
  --warn-soft: rgba(196, 128, 18, .14);
  --loss: #b8322a;
  --loss-soft: rgba(184, 50, 42, .1);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Golos Text", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f15;
    --surface: #111922;
    --ink: #e7eef6;
    --muted: #96a6b8;
    --line: #213040;
    --accent: #4fb7f3;
    --accent-soft: rgba(79, 183, 243, .14);
    --before: #3d4b5b;
    --win: #4fd08d;
    --win-soft: rgba(79, 208, 141, .13);
    --warn: #f2b65a;
    --warn-soft: rgba(242, 182, 90, .14);
    --loss: #ff8177;
    --loss-soft: rgba(255, 129, 119, .13);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0f15;
  --surface: #111922;
  --ink: #e7eef6;
  --muted: #96a6b8;
  --line: #213040;
  --accent: #4fb7f3;
  --accent-soft: rgba(79, 183, 243, .14);
  --before: #3d4b5b;
  --win: #4fd08d;
  --win-soft: rgba(79, 208, 141, .13);
  --warn: #f2b65a;
  --warn-soft: rgba(242, 182, 90, .14);
  --loss: #ff8177;
  --loss-soft: rgba(255, 129, 119, .13);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
.deck { display: flex; flex-direction: column; gap: 28px; padding-block: 28px 96px; padding-inline: 16px; max-width: 1180px; margin: 0 auto; }
.slide {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: clamp(22px, 4vw, 52px);
  display: flex;
  flex-direction: column;
  gap: 22px;
  scroll-margin-top: 16px;
}
body.presenting .slide { min-height: calc(100vh - 56px); justify-content: center; }
.slide-head { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { display: flex; gap: 12px; align-items: baseline; font: 600 12.5px/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.eyebrow .num { font-family: var(--font-data); letter-spacing: 0; color: var(--accent); }
h1, h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(36px, 6.2vw, 72px); line-height: 1.02; }
h2 { font-size: clamp(27px, 3.6vw, 44px); line-height: 1.08; }
.lede { margin: 0; color: var(--muted); font-size: clamp(16px, 1.6vw, 19px); max-width: 68ch; }
.lede b { color: var(--ink); font-weight: 600; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 26px; font-size: 14.5px; color: var(--muted); }
.stats b { font-family: var(--font-data); color: var(--ink); font-weight: 700; }
.heroes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.hero { border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hero .x { font: 800 clamp(40px, 5vw, 58px)/.95 var(--font-display); color: var(--accent); letter-spacing: -.03em; }
.hero .what { font-weight: 600; font-size: 15.5px; line-height: 1.3; }
.hero .ba { font: 500 13px/1.45 var(--font-data); color: var(--muted); }
.hero .ba .arrow { color: var(--accent); }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(170px, 32%) 1fr minmax(92px, auto); gap: 6px 20px; align-items: center; padding: 13px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .label { font-weight: 600; font-size: 15px; line-height: 1.3; min-width: 0; }
.row .label small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
.bars { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.bar { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bar .fill { height: 13px; border-radius: 4px; flex: none; }
.bar.before .fill { background: var(--before); }
.bar.after .fill { background: var(--accent); }
.bar .v { font: 500 13px/1.2 var(--font-data); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar.after .v { color: var(--ink); font-weight: 700; }
.bar.text .v { white-space: normal; }
.gain { justify-self: end; text-align: right; font: 700 15px/1.2 var(--font-data); color: var(--accent); white-space: nowrap; }
.gain small { display: block; font: 500 11.5px/1.3 var(--font-body); color: var(--muted); }
.gain.even { color: var(--muted); }
.gain.cost { color: var(--warn); }
.legend { display: flex; gap: 18px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
.legend .b::before { background: var(--before); }
.legend .a::before { background: var(--accent); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: start; }
.split .col, .block { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.split .row { grid-template-columns: minmax(120px, 38%) 1fr auto; gap: 6px 14px; }
.note { font-size: 14px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 14px; margin: 0; }
.points { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.points li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; font-size: 15px; line-height: 1.45; }
.points li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 8px; }
.chip { display: inline-block; font: 600 11.5px/1 var(--font-body); padding: 5px 9px; border-radius: 999px; white-space: nowrap; letter-spacing: .02em; }
.chip.shipped { color: var(--win); background: var(--win-soft); }
.chip.progress { color: var(--warn); background: var(--warn-soft); }
.chip.reverted { color: var(--loss); background: var(--loss-soft); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 13.5px; table-layout: fixed; }
col.c-what { width: 34%; } col.c-before { width: 21%; } col.c-after { width: 21%; } col.c-gain { width: 12%; } col.c-status { width: 12%; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11.5px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: var(--surface); position: sticky; top: 0; }
td.num { font-family: var(--font-data); font-size: 12.5px; overflow-wrap: anywhere; }
td.num.after { color: var(--accent); font-weight: 700; }
tr.group td { background: var(--accent-soft); font-weight: 700; font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl { display: grid; grid-template-columns: 140px 1fr; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); align-items: baseline; }
.tl:first-child { border-top: 0; }
.tl b { font: 700 13.5px/1.3 var(--font-data); color: var(--accent); }
.tl span { font-size: 16px; line-height: 1.45; min-width: 0; }
.nav {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px; box-shadow: 0 6px 24px rgba(10, 20, 30, .12);
}
.nav button { font: 600 13px/1 var(--font-body); color: var(--ink); background: transparent; border: 0; border-radius: 999px; padding: 9px 13px; cursor: pointer; }
.nav button:hover { background: var(--accent-soft); }
.nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav .pos { font: 600 13px/1 var(--font-data); color: var(--muted); padding: 0 6px; min-width: 52px; text-align: center; }
@media (max-width: 760px) {
  .split { grid-template-columns: 1fr; }
  .tl { grid-template-columns: 1fr; gap: 2px; }
  .row { grid-template-columns: 1fr auto; }
  .row .bars { grid-column: 1 / -1; grid-row: 2; }
  .gain { grid-row: 1; grid-column: 2; }
  .nav .present { display: none; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (value, max = 2) => Number(value).toLocaleString('en-US', { maximumFractionDigits: max });
const fx = (r) => (r >= 9.95 ? nf(r, 0) : r >= 1.95 ? nf(r, 1) : nf(r, 2));

function gainText(row) {
  if (row.gain) return row.gain;
  const b = row.b, a = row.a;
  if (b == null || a == null) return '';
  if (row.better === 'higher') {
    const r = a / b;
    return r >= 1.05 ? `${fx(r)}× more` : '';
  }
  if (a === 0) return 'none left';
  const r = b / a;
  if (r >= 1.05) return `${fx(r)}× less`;
  return '';
}

function rowHtml(row) {
  const values = [row.b, row.a].filter((v) => v != null && v > 0);
  const hi = values.length ? Math.max(...values) : 1;
  const width = (v) => (v == null ? 0 : Math.max(1.5, 78 * (v / hi)));
  const gain = gainText(row);
  const gainCls = row.gainClass ? `gain ${row.gainClass}` : 'gain';
  const textMode = row.b == null && row.a == null;
  const bar = (cls, v, text) => `<div class="bar ${cls}${textMode ? ' text' : ''}"><div class="fill" style="width:${textMode ? 0 : width(v)}%"></div><div class="v">${esc(text)}</div></div>`;
  return `<div class="row">
    <div class="label">${esc(row.label)}${row.sub ? `<small>${esc(row.sub)}</small>` : ''}</div>
    <div class="bars">${bar('before', row.b, row.bt)}${bar('after', row.a, row.at)}</div>
    <div class="${gainCls}">${esc(gain)}${row.gainSub ? `<small>${esc(row.gainSub)}</small>` : ''}</div>
  </div>`;
}

function renderBlock(block) {
  if (block.type === 'heroes') {
    return `<div class="heroes">${block.items.map((h) => `<div class="hero"><div class="x">${esc(h.x)}</div><div class="what">${esc(h.what)}</div><div class="ba">${esc(h.before)} <span class="arrow">→</span> ${esc(h.after)}</div></div>`).join('')}</div>`;
  }
  if (block.type === 'rows') {
    return `<div class="block">${block.title ? `<div class="eyebrow">${esc(block.title)}</div>` : ''}<div class="rows">${block.rows.map(rowHtml).join('')}</div></div>`;
  }
  if (block.type === 'legend') {
    return `<div class="legend"><span class="b">${esc(block.before || 'Before')}</span><span class="a">${esc(block.after || 'After')}</span></div>`;
  }
  if (block.type === 'stats') {
    return `<div class="stats">${block.items.map((s) => `<span><b>${esc(s.v)}</b> ${esc(s.l)}</span>`).join('')}</div>`;
  }
  if (block.type === 'points') {
    return `<ul class="points">${block.items.map((p) => `<li><span>${p}</span></li>`).join('')}</ul>`;
  }
  if (block.type === 'note') {
    return `<p class="note">${block.html}</p>`;
  }
  if (block.type === 'split') {
    return `<div class="split"><div class="col">${block.left.map(renderBlock).join('')}</div><div class="col">${block.right.map(renderBlock).join('')}</div></div>`;
  }
  if (block.type === 'timeline') {
    return `<ol class="timeline">${block.items.map((t) => `<li class="tl"><b>${esc(t.when)}</b><span>${esc(t.what)}</span></li>`).join('')}</ol>`;
  }
  if (block.type === 'table') {
    return tableHtml(block);
  }
  return '';
}

function slideHtml(slide, index, total) {
  const num = `${String(index + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;
  const heading = index === 0 ? `<h1>${esc(slide.title)}</h1>` : `<h2>${esc(slide.title)}</h2>`;
  return `<section class="slide" id="${esc(slide.id)}" aria-label="${esc(slide.title)}">
    <div class="slide-head">
      <div class="eyebrow"><span class="num">${num}</span><span>${esc(slide.eyebrow || '')}</span></div>
      ${heading}
      ${slide.lede ? `<p class="lede">${slide.lede}</p>` : ''}
    </div>
    ${(slide.blocks || []).map(renderBlock).join('')}
  </section>`;
}

function tableHtml(block) {
  const status = (s) => {
    const cls = s === 'shipped' ? 'shipped' : s === 'reverted' ? 'reverted' : 'progress';
    const label = s === 'shipped' ? 'In beta' : s === 'reverted' ? 'Reverted' : 'In progress';
    return `<span class="chip ${cls}">${label}</span>`;
  };
  let rows = '';
  for (const group of block.groups) {
    rows += `<tr class="group"><td colspan="5">${esc(group.name)}</td></tr>`;
    for (const r of group.rows) {
      rows += `<tr><td>${esc(r.what)}</td><td class="num">${esc(r.before)}</td><td class="num after">${esc(r.after)}</td><td class="num">${esc(r.gain || '')}</td><td>${status(r.status)}</td></tr>`;
    }
  }
  return `<div class="tablewrap"><table><colgroup><col class="c-what"><col class="c-before"><col class="c-after"><col class="c-gain"><col class="c-status"></colgroup><thead><tr><th>Change</th><th>Before</th><th>After</th><th>Change in value</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

const deck = document.getElementById('deck');
deck.innerHTML = DATA.slides.map((s, i) => slideHtml(s, i, DATA.slides.length)).join('');

const slides = Array.from(document.querySelectorAll('.slide'));
const pos = document.getElementById('pos');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function currentIndex() {
  const mid = window.innerHeight * 0.35;
  let best = 0;
  slides.forEach((s, i) => { if (s.getBoundingClientRect().top <= mid) best = i; });
  return best;
}
function go(i) {
  const target = slides[Math.max(0, Math.min(slides.length - 1, i))];
  target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
}
function updatePos() { pos.textContent = `${currentIndex() + 1} / ${slides.length}`; }
document.getElementById('prev').addEventListener('click', () => go(currentIndex() - 1));
document.getElementById('next').addEventListener('click', () => go(currentIndex() + 1));
document.getElementById('present').addEventListener('click', () => {
  document.body.classList.toggle('presenting');
  const el = document.documentElement;
  if (document.body.classList.contains('presenting') && el.requestFullscreen) {
    el.requestFullscreen().catch(() => {});
  } else if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
  go(currentIndex());
});
document.addEventListener('keydown', (event) => {
  if (event.target.closest('input, textarea, select')) return;
  const i = currentIndex();
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); go(i + 1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); go(i - 1); }
  else if (event.key === 'Home') { event.preventDefault(); go(0); }
  else if (event.key === 'End') { event.preventDefault(); go(slides.length - 1); }
});
window.addEventListener('scroll', updatePos, { passive: true });
updatePos();
</script>

</body>
